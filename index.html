<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#d4af37",
                    "primary-fixed": "#ffe088",
                    "error": "#ffb4ab",
                    "on-tertiary": "#303130",
                    "on-error-container": "#ffdad6",
                    "outline-variant": "#4d4635",
                    "tertiary-fixed-dim": "#c7c6c4",
                    "on-tertiary-fixed-variant": "#464746",
                    "tertiary": "#cfcecc",
                    "on-secondary": "#2f3131",
                    "surface-container-lowest": "#0e0e0e",
                    "secondary-fixed-dim": "#c6c6c6",
                    "surface-container": "#201f1f",
                    "on-surface": "#e5e2e1",
                    "on-primary-container": "#554300",
                    "surface-bright": "#393939",
                    "surface-tint": "#e9c349",
                    "surface-container-low": "#1c1b1b",
                    "on-primary-fixed-variant": "#574500",
                    "inverse-surface": "#e5e2e1",
                    "surface-container-high": "#2a2a2a",
                    "tertiary-container": "#b3b3b1",
                    "inverse-on-surface": "#313030",
                    "secondary-fixed": "#e3e2e2",
                    "secondary": "#c6c6c6",
                    "surface-variant": "#353534",
                    "on-secondary-container": "#b8b8b8",
                    "on-surface-variant": "#d0c5af",
                    "on-primary": "#3c2f00",
                    "on-primary-fixed": "#241a00",
                    "error-container": "#93000a",
                    "secondary-container": "#484949",
                    "on-tertiary-container": "#444544",
                    "on-background": "#e5e2e1",
                    "on-error": "#690005",
                    "primary-fixed-dim": "#e9c349",
                    "on-secondary-fixed-variant": "#464747",
                    "inverse-primary": "#735c00",
                    "on-secondary-fixed": "#1a1c1c",
                    "background": "#131313",
                    "surface-dim": "#131313",
                    "surface-container-highest": "#353534",
                    "primary": "#f2ca50",
                    "surface": "#131313",
                    "outline": "#99907c",
                    "on-tertiary-fixed": "#1b1c1b",
                    "tertiary-fixed": "#e3e2e0"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Noto Serif"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
    <style>
        body { font-family: 'Manrope', sans-serif; }
        .font-serif { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .splide__pagination__page {
            background: #4d4635 !important;
            opacity: 0.5;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }
        .splide__pagination__page.is-active {
            background: #d4af37 !important;
            opacity: 1;
            transform: scale(1);
        }
        .splide__arrow svg {
            display: none;
        }
        .splide__arrow {
            border: 1px solid rgba(212, 175, 55, 0.2) !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); }
            to { transform: translateX(100%); }
        }
        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
        .animate-slideUp { animation: slideUp 0.5s ease-out; }
        .animate-scaleIn { animation: scaleIn 0.3s ease-out; }
        .animate-slideInRight { animation: slideInRight 0.3s ease-out; }
        .animate-heartPop { animation: heartPop 0.3s ease-out; }

        .fade-in-section {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .fade-in-section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #131313; }
        ::-webkit-scrollbar-thumb { background: #4d4635; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }

        /* Volume slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 4px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f2ca50;
            cursor: pointer;
            border: 2px solid #131313;
        }
    </style>
    <title>The Midnight Gala</title>
  </head>
  <body class="bg-background text-on-surface selection:bg-primary-container selection:text-on-primary-container">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
